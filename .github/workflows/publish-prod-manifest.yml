# Publish the production manifest PR CI reads as production state (VD-7576): on a push to main, the engine
# parses the dbt project for production and publishes the `dbt-manifest-<sha>` release plus the manifests on
# `dbt-docs-latest`. Calls the jasonkhaihoang-org engine copy, as this org's other model-answer repos do.
# The dbt Docs site stays with publish-dbt-docs.yml, which uploads only static_index.html to the same release.
name: Publish Prod Manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

# dbt-docs-latest is repo-wide: overlapping runs queue instead of clobbering it mid-upload.
concurrency:
  group: vibedata-publish
  cancel-in-progress: false

permissions:
  contents: write   # GitHub Releases: dbt-manifest-<sha> and dbt-docs-latest
  id-token: write   # required by the called workflow (Fabric OIDC; unused on MotherDuck)

jobs:
  publish-manifest:
    uses: jasonkhaihoang-org/domain-cicd/.github/workflows/publish-manifest.yml@main
