metrics:
  - name: shift_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN shift.shift_id IS NOT NULL THEN 1 ELSE 0 END)
    description: Driver sign-ons.
    datatype: Integer
    ai_context:
      synonyms:
        - Shifts
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM"}'
  - name: online_hours
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(shift.online_seconds) / 3600.0
    description: Hours a driver was signed on, from effective shift end so an unclosed shift keeps the time it was worked.
    datatype: Decimal
    ai_context:
      synonyms:
        - Online hours
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM"}'
  - name: on_trip_hours
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(shift.on_trip_seconds) / 3600.0
    description: Hours a driver was carrying a fare.
    datatype: Decimal
    ai_context:
      synonyms:
        - On-trip hours
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM"}'
  - name: on_trip_interval_hours
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN status_interval.status_code = 'ON_TRIP' THEN status_interval.interval_seconds ELSE 0 END) / 3600.0
    description: Hours of on-trip status intervals, located by zone and daypart. The status feed's view of on-trip time, which is what a zone or daypart can be grouped by.
    datatype: Decimal
    ai_context:
      synonyms:
        - On-trip hours by zone
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "filter": "status_interval.status_code = ''ON_TRIP''"}'
  - name: fleet_on_trip_hours
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(shift.on_trip_seconds) / 3600.0
    description: The fleet's on-trip hours from shifts. Grouped by a dimension shifts do not reach (zone, daypart) it repeats the total for the rest of the query's grain instead of failing, so it can be the denominator of a zone's share.
    datatype: Decimal
    ai_context:
      synonyms:
        - Fleet on-trip hours
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM", "unrelated_dimensions": "total"}'
  - name: zone_share_of_fleet_on_trip_hours
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN status_interval.status_code = 'ON_TRIP' THEN status_interval.interval_seconds ELSE 0 END) * 1.0 / NULLIF(SUM(shift.on_trip_seconds), 0)
    description: "Share of the fleet's on-trip hours spent in each zone or daypart: located on-trip hours over the fleet's on-trip hours, which repeat across zones."
    datatype: Decimal
    ai_context:
      synonyms:
        - Share of on-trip time
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "derived_expression": "on_trip_interval_hours * 1.0 / NULLIF(fleet_on_trip_hours, 0)"}'
  - name: gross_revenue
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(shift.gross_revenue)
    description: Revenue earned on the fleet's shifts.
    datatype: Decimal
    ai_context:
      synonyms:
        - Gross revenue
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "SUM"}'
  - name: occupancy_rate
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(shift.on_trip_seconds) * 1.0 / NULLIF(SUM(shift.online_seconds), 0)
    description: Share of online time spent carrying a fare, rebuilt from summed seconds (ADR 0016); null when the fleet was never online.
    datatype: Decimal
    ai_context:
      synonyms:
        - Occupancy rate
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "derived_expression": "on_trip_hours * 1.0 / NULLIF(online_hours, 0)"}'
  - name: revenue_per_online_hour
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(shift.gross_revenue) * 1.0 / NULLIF(SUM(shift.online_seconds) / 3600.0, 0)
    description: Gross revenue per online hour, from summed revenue and summed hours. The driver ranking basis (ADR 0010).
    datatype: Decimal
    ai_context:
      synonyms:
        - Revenue per online hour
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "derived_expression": "gross_revenue * 1.0 / NULLIF(online_hours, 0)"}'
  - name: mean_driver_occupancy_rate
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(shift.on_trip_seconds) * 1.0 / NULLIF(SUM(shift.online_seconds), 0)
    description: "Unweighted mean of each driver's occupancy rate: the rate is rebuilt per driver first (ADR 0016), then drivers are averaged with equal weight. occupancy_rate is the fleet's time-weighted figure."
    datatype: Decimal
    ai_context:
      synonyms:
        - Average driver occupancy
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "based_on_dimensions": {"of": "occupancy_rate", "across": [{"via": "shift_to_driver"}], "rule": "AVG"}}'
  - name: occupancy_rate_month_to_date
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(shift.on_trip_seconds) * 1.0 / NULLIF(SUM(shift.online_seconds), 0)
    description: "Occupancy from the first of the month to each row's date: the ratio of to-date on-trip hours to to-date online hours, never a running sum of daily rates."
    datatype: Decimal
    ai_context:
      synonyms:
        - Month-to-date occupancy
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "time_series": {"function": "TODATE", "of": "occupancy_rate", "via": "shift_to_date", "level": "month"}}'
  - name: active_driver_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT shift.driver_key)
    description: "Distinct drivers who signed on. A distinct count: it never sums across days or drivers, so only a source at the query's own grain, or the detail, can answer it."
    datatype: Integer
    ai_context:
      synonyms:
        - Active drivers
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "aggregation": "NON_ADDITIVE"}'
  - name: avg_daily_active_drivers
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT shift.driver_key)
    description: "Distinct drivers per shift day, averaged over the days with shifts."
    datatype: Decimal
    ai_context:
      synonyms:
        - Average daily active drivers
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "based_on_dimensions": {"of": "active_driver_count", "across": [{"via": "shift_to_date", "level": "day"}], "rule": "AVG"}}'
  - name: closing_active_driver_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT shift.driver_key)
    description: "Distinct drivers on the last day of the period that had shifts: a time balance, so a month reports its closing headcount, not the sum of its days."
    datatype: Integer
    ai_context:
      synonyms:
        - Closing active drivers
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "based_on_dimensions": {"of": "active_driver_count", "across": [{"via": "shift_to_date", "level": "day"}], "rule": "LAST"}}'
