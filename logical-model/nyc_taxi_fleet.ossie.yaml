version: "0.2.0.dev0"
name: nyc_taxi_fleet
description: "Fleet operations for the Harbour Point fleet: driver sign-ons, vehicle status intervals and maintenance downtime, with the conformed driver, vehicle, garage, date, daypart and zone dimensions. Fleet star of the nyc-taxi-duckdb-demo warehouse."
ai_context:
  instructions: "Use for fleet-ops questions — driver and vehicle utilisation, garage-level performance, and where the fleet waits by zone and hour. Rates are rebuilt from summed numerators and denominators (ADR 0016), never averaged from row-level rate columns. Maintenance down-days are semi-additive (ADR 0010 for the utilisation split): expand them to a daily grain before computing availability."
  synonyms:
    - fleet operations
    - driver and vehicle utilisation
    - shift performance
datasets:
  - name: shift
    source: core.fct_shift
    primary_key: [shift_id]
    description: One row per driver sign-on, bridging the operational world (occupancy, leases) and the revenue world (trips).
    ai_context:
      synonyms:
        - shifts
        - sign-ons
    fields:
      - name: shift_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: shift_id
        datatype: String
        description: Sign-on identifier; the grain of the fleet revenue fact.
      - name: shift_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: shift_date
        datatype: Date
        dimension:
          is_time: true
        description: Calendar date of sign-on.
      - name: shift_date_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: shift_date_key
        datatype: Integer
        description: Surrogate key into date for the shift date.
      - name: driver_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: driver_key
        datatype: String
        description: Driver who signed on.
      - name: vehicle_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vehicle_key
        datatype: String
        description: Vehicle operated during the shift.
      - name: garage_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: garage_key
        datatype: String
        description: Driver's home garage at sign-on, carried from dim_driver; not the vehicle's garage.
      - name: engagement_type
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: engagement_type
        datatype: String
        description: How the driver is engaged (employee, contractor, ...).
      - name: lease_type
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: lease_type
        datatype: String
        description: Lease arrangement in force for the shift; null when the driver is not on a lease.
      - name: shift_start_ts
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: shift_start_ts
        datatype: DateTime
        description: Timestamp the driver signed on.
      - name: is_unclosed_shift
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_unclosed_shift
        datatype: Boolean
        description: True when no sign-off event closed the shift and the effective end was used instead.
      - name: online_seconds
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: online_seconds
        datatype: Integer
        description: Signed-on seconds, to the shift's effective end. Denominator of the rate metrics; aggregate only through metrics.
      - name: on_trip_seconds
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: on_trip_seconds
        datatype: Integer
        description: Seconds spent carrying a fare. Numerator of occupancy; aggregate only through metrics.
      - name: trip_count
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: trip_count
        datatype: Integer
        description: Trips attributed to the shift, row level; sum it rather than reading a single row.
      - name: gross_revenue
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: gross_revenue
        datatype: Decimal
        description: Revenue earned on the shift's trips, row level; aggregate only through metrics.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "logical_sources": [{"name": "LTS1_detail", "physical_table": "fct_shift", "priority_group": 1, "content_grain": ["shift"], "note": "Refused columns: available_seconds, break_seconds, unaccounted_seconds, idle_rate, occupancy_rate, fare_revenue, tip_revenue, airport_fee_collected, surcharge_collected, recognised_revenue, paid_miles, paid_seconds, shift_cost, shift_margin, revenue_per_online_hour, revenue_per_paid_mile, odometer_miles, paid_mile_ratio, negative_interval_count, telematics_source, effective_end_ts. Fare components belong to the trips star, the row-level ratios are withdrawn in favour of the metric expressions (ADR 0016), and the rest are outside the six shift metrics this document scopes (S2).", "column_map": {"shift_id": "shift_id", "shift_date": "shift_date", "shift_date_key": "shift_date_key", "driver_key": "driver_key", "vehicle_key": "vehicle_key", "garage_key": "garage_key", "engagement_type": "engagement_type", "lease_type": "lease_type", "shift_start_ts": "shift_start_ts", "is_unclosed_shift": "is_unclosed_shift", "online_seconds": "online_seconds", "on_trip_seconds": "on_trip_seconds", "trip_count": "trip_count", "gross_revenue": "gross_revenue", "shift_count": "shift_id", "online_hours": "online_seconds", "on_trip_hours": "on_trip_seconds", "active_driver_count": "driver_key", "fleet_on_trip_hours": "on_trip_seconds"}}, {"name": "LTS2_driver_day", "physical_table": "agg_driver_daily", "priority_group": 0, "content_grain": ["shift_date", "driver_key"], "column_map": {"shift_date": "shift_date", "shift_date_key": "date_key", "driver_key": "driver_key", "garage_key": "garage_key", "engagement_type": "engagement_type", "trip_count": "trip_count", "shift_count": "shift_count", "online_hours": "online_hours", "on_trip_hours": "on_trip_hours", "gross_revenue": "gross_revenue", "fleet_on_trip_hours": "on_trip_hours"}, "note": "Refused: driver_ref, home_garage_name (driver dataset attributes), vehicles_driven, break_hours, tip_revenue, airport_fee_collected, total_cost, total_margin, paid_miles, unclosed_shift_count, revenue_per_trip — measures outside the six shift metrics this document scopes (S2). occupancy_rate and revenue_per_online_hour are computed after aggregation from their summed inputs (ADR 0016), never read from this source''s ratio columns. The inner join to dim_driver drops a shift with no driver key; the relationships test on fct_shift.driver_key ignores nulls, so the filter is stated, not assumed. Binding held by assert_semantic_content_holds.", "content_levels": [{"via": "shift_to_date", "level": "day", "key_columns": ["shift_date"]}, {"via": "shift_to_driver", "key_columns": ["driver_key"]}], "content_filter": "driver_key IS NOT NULL"}, {"name": "LTS3_driver_month", "physical_table": "agg_driver_monthly", "priority_group": 0, "content_grain": ["month_start_date", "driver_key"], "column_map": {"driver_key": "driver_key", "garage_key": "garage_key", "engagement_type": "engagement_type", "trip_count": "trip_count", "shift_count": "shift_count", "online_hours": "online_hours", "on_trip_hours": "on_trip_hours", "gross_revenue": "gross_revenue", "fleet_on_trip_hours": "on_trip_hours"}, "note": "Refused: month_start_date is the grain of this source, not shift_date, so no date field is mapped; driver_ref, home_garage_name (driver dataset attributes), active_days, tip_revenue, total_cost, total_margin, paid_miles, trips_per_online_hour, margin_rate are out of scope (S2). occupancy_rate and revenue_per_online_hour are computed after aggregation from their summed inputs (ADR 0016), never read from this source''s ratio columns. The inner join to dim_driver drops a shift with no driver key; the relationships test on fct_shift.driver_key ignores nulls, so the filter is stated, not assumed. Binding held by assert_semantic_content_holds.", "content_levels": [{"via": "shift_to_date", "level": "month", "key_columns": ["month_start_date"]}, {"via": "shift_to_driver", "key_columns": ["driver_key"]}], "content_filter": "driver_key IS NOT NULL"}, {"name": "LTS4_vehicle_day", "physical_table": "agg_vehicle_daily", "priority_group": 0, "content_grain": ["shift_date", "vehicle_key"], "column_map": {"shift_date": "shift_date", "shift_date_key": "date_key", "vehicle_key": "vehicle_key", "trip_count": "trip_count", "shift_count": "shift_count", "online_hours": "online_hours", "on_trip_hours": "on_trip_hours", "gross_revenue": "gross_revenue", "fleet_on_trip_hours": "on_trip_hours"}, "note": "Refused: medallion_number, make_model, fuel_type, is_low_emission (vehicle dataset attributes); garage_key refused because this agg carries the dim_vehicle garage, not the driver home garage the shift field means; distinct_drivers, paid_miles, odometer_miles, asset_utilisation_rate, paid_mile_ratio out of scope; revenue_per_online_hour is not computed at this grain. occupancy_rate are computed after aggregation from their summed inputs (ADR 0016), never read from this source''s ratio columns. The inner join to dim_vehicle drops a shift with no vehicle key; the relationships test on fct_shift.vehicle_key ignores nulls, so the filter is stated, not assumed. Binding held by assert_semantic_content_holds.", "content_levels": [{"via": "shift_to_date", "level": "day", "key_columns": ["shift_date"]}, {"via": "shift_to_vehicle", "key_columns": ["vehicle_key"]}], "content_filter": "vehicle_key IS NOT NULL"}, {"name": "LTS5_vehicle_month", "physical_table": "agg_vehicle_monthly", "priority_group": 0, "content_grain": ["month_start_date", "vehicle_key"], "column_map": {"vehicle_key": "vehicle_key", "trip_count": "trip_count", "shift_count": "shift_count", "online_hours": "online_hours", "on_trip_hours": "on_trip_hours", "gross_revenue": "gross_revenue", "fleet_on_trip_hours": "on_trip_hours"}, "note": "Refused: medallion_number, make_model, fuel_type (vehicle dataset attributes); garage_key refused (the vehicle garage, not the shift driver home garage); active_days, paid_miles, down_days, maintenance_cost, calendar_days, available_days, availability_adjusted_activity_rate out of scope (S2). occupancy_rate and revenue_per_online_hour are computed after aggregation from their summed inputs (ADR 0016), never read from this source''s ratio columns. The inner join to dim_vehicle drops a shift with no vehicle key; the relationships test on fct_shift.vehicle_key ignores nulls, so the filter is stated, not assumed. Binding held by assert_semantic_content_holds.", "content_levels": [{"via": "shift_to_date", "level": "month", "key_columns": ["month_start_date"]}, {"via": "shift_to_vehicle", "key_columns": ["vehicle_key"]}], "content_filter": "vehicle_key IS NOT NULL"}, {"name": "LTS6_garage_month", "physical_table": "agg_garage_monthly", "priority_group": 0, "content_grain": ["month_start_date", "garage_key"], "column_map": {"trip_count": "trip_count", "shift_count": "shift_count", "online_hours": "online_hours", "on_trip_hours": "on_trip_hours", "gross_revenue": "gross_revenue", "fleet_on_trip_hours": "on_trip_hours"}, "note": "garage_key is the grain but is not mapped as a field: the group is the dim_garage garage reached through the vehicle, not the driver home garage the shift field means. Refused: garage_name, borough_name, bay_capacity (garage dataset attributes), active_vehicles, maintenance_cost, down_days, bay_occupancy_rate out of scope (S2). occupancy_rate and revenue_per_online_hour are computed after aggregation from their summed inputs (ADR 0016), never read from this source''s ratio columns. Built from agg_vehicle_monthly (inner join to dim_vehicle) and inner joined to dim_garage through the vehicle''s garage; a vehicle without a garage would also drop out, which no shift field can state, so the generated test is what proves the totals still match. Binding held by assert_semantic_content_holds.", "content_levels": [{"via": "shift_to_date", "level": "month", "key_columns": ["month_start_date"]}], "content_filter": "vehicle_key IS NOT NULL"}, {"name": "LTS7_driver_scorecard", "physical_table": "mart_driver_scorecard", "priority_group": 0, "content_grain": ["driver_key"], "note": "Refused: driver_ref, home_garage_name (driver dataset attributes); active_days, tip_revenue, total_cost, total_margin, paid_miles, revenue_per_trip, trips_per_online_hour, tip_share, is_below_ranking_floor, fleet_rank, garage_rank, revenue_quartile, occupancy_percentile — ranking and cost columns belong to the scorecard report, not the six metrics of this star (S2). occupancy_rate and revenue_per_online_hour are computed after aggregation from their summed inputs (ADR 0016), never read from this source''s ratio columns. The inner join to dim_driver drops a shift with no driver key; the relationships test on fct_shift.driver_key ignores nulls, so the filter is stated, not assumed. Binding held by assert_semantic_content_holds.", "column_map": {"driver_key": "driver_key", "garage_key": "garage_key", "engagement_type": "engagement_type", "trip_count": "trip_count", "shift_count": "shift_count", "online_hours": "online_hours", "on_trip_hours": "on_trip_hours", "gross_revenue": "gross_revenue", "fleet_on_trip_hours": "on_trip_hours"}, "content_levels": [{"via": "shift_to_driver", "key_columns": ["driver_key"]}], "content_filter": "driver_key IS NOT NULL"}, {"name": "LTS8_vehicle_utilisation", "physical_table": "mart_vehicle_utilisation", "priority_group": 0, "content_grain": ["vehicle_key"], "note": "Refused: medallion_number, make_model, model_year, fuel_type, is_low_emission, is_in_service (vehicle dataset attributes), garage_name (garage dataset attribute); garage_key refused (the vehicle garage); active_days, paid_miles, down_days, maintenance_cost, available_days, availability_adjusted_rate, net_revenue_per_active_day out of scope (S2). occupancy_rate and revenue_per_online_hour are computed after aggregation from their summed inputs (ADR 0016), never read from this source''s ratio columns. The inner join to dim_vehicle drops a shift with no vehicle key; the relationships test on fct_shift.vehicle_key ignores nulls, so the filter is stated, not assumed. Binding held by assert_semantic_content_holds.", "column_map": {"vehicle_key": "vehicle_key", "trip_count": "trip_count", "shift_count": "shift_count", "online_hours": "online_hours", "on_trip_hours": "on_trip_hours", "gross_revenue": "gross_revenue", "fleet_on_trip_hours": "on_trip_hours"}, "content_levels": [{"via": "shift_to_vehicle", "key_columns": ["vehicle_key"]}], "content_filter": "vehicle_key IS NOT NULL"}, {"name": "LTS9_vehicle_scorecard", "physical_table": "mart_vehicle_scorecard", "priority_group": 0, "content_grain": ["month_start_date", "vehicle_key"], "column_map": {"vehicle_key": "vehicle_key", "trip_count": "trip_count", "online_hours": "online_hours", "on_trip_hours": "on_trip_hours", "gross_revenue": "gross_revenue", "fleet_on_trip_hours": "on_trip_hours"}, "note": "Built on agg_vehicle_monthly as published, so its rows are that source''s rows: the shift rows rolled up per vehicle and month. Refused: medallion_number (a vehicle dataset attribute); garage_key (the vehicle garage, not the shift driver home garage); active_days, is_below_ranking_floor, is_incomplete_month, fleet_rank, garage_rank, revenue_per_trip, trips_per_online_hour belong to the scorecard report, not this star''s metrics (S2). occupancy_rate and revenue_per_online_hour are computed after aggregation from their summed inputs (ADR 0016), never read from this source''s ratio columns. The inner join to dim_vehicle behind agg_vehicle_monthly drops a shift with no vehicle key, so the filter is stated. Binding held by assert_semantic_content_holds.", "content_levels": [{"via": "shift_to_date", "level": "month", "key_columns": ["month_start_date"]}, {"via": "shift_to_vehicle", "key_columns": ["vehicle_key"]}], "content_filter": "vehicle_key IS NOT NULL"}]}'
  - name: status_interval
    source: core.fct_status_interval
    primary_key: [interval_id]
    description: One row per driver state interval. The only place idle time is locatable — a trip says where a driver earned, this says where they waited.
    ai_context:
      synonyms:
        - status intervals
        - occupancy intervals
    fields:
      - name: interval_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: interval_id
        datatype: String
        description: Interval identifier; the grain of the occupancy fact.
      - name: shift_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: shift_id
        datatype: String
        description: Shift the interval belongs to.
      - name: driver_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: driver_key
        datatype: String
        description: Driver the interval is attributed to.
      - name: vehicle_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vehicle_key
        datatype: String
        description: Vehicle the driver was in during the interval.
      - name: interval_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: interval_date
        datatype: Date
        dimension:
          is_time: true
        description: Calendar date the interval started.
      - name: interval_date_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: interval_date_key
        datatype: Integer
        description: Surrogate key into date for the interval date.
      - name: interval_hour
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: interval_hour
        datatype: Integer
        description: Hour of day the interval started (0-23), joins dim_daypart.
      - name: daypart_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: daypart_code
        datatype: String
        description: Analyst-owned daypart band for interval_hour.
      - name: zone_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_key
        datatype: String
        description: Zone surrogate resolved to the current version of the zone.
      - name: zone_natural_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: zone_natural_key
        datatype: Integer
        description: TLC location_id of the interval's zone.
      - name: status_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: status_code
        datatype: String
        description: Driver state for the interval (LOGIN, AVAILABLE, DISPATCHED, ON_TRIP, BREAK, LOGOUT).
      - name: interval_seconds
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: interval_seconds
        datatype: Integer
        description: Duration of the interval. Sum it for time; do not read a single row.
      - name: is_negative_interval
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_negative_interval
        datatype: Boolean
        description: True when the event stream closes the interval before it opens; a quality flag, not a duration.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "logical_sources": [{"name": "LTS1_detail", "physical_table": "fct_status_interval", "priority_group": 1, "content_grain": ["interval"], "note": "Refused: interval_start_ts, interval_end_ts (derivable from date, hour and duration and outside the scope of this document), is_terminal_interval and skew_seconds (stream audit columns, not semantic attributes). S2.", "column_map": {"interval_id": "interval_id", "shift_id": "shift_id", "driver_key": "driver_key", "vehicle_key": "vehicle_key", "interval_date": "interval_date", "interval_date_key": "interval_date_key", "interval_hour": "interval_hour", "daypart_code": "daypart_code", "zone_key": "zone_key", "zone_natural_key": "zone_natural_key", "status_code": "status_code", "interval_seconds": "interval_seconds", "is_negative_interval": "is_negative_interval", "on_trip_interval_hours": "interval_seconds"}}, {"name": "LTS2_zone_hour", "physical_table": "agg_zone_occupancy_hourly", "priority_group": 0, "content_grain": ["interval_date", "interval_hour", "location_id"], "column_map": {"interval_date": "interval_date", "interval_hour": "interval_hour", "daypart_code": "daypart_code", "zone_natural_key": "location_id"}, "note": "Refused: zone_key (this agg carries the zone natural key, not the surrogate), interval_id, shift_id, driver_key, vehicle_key, interval_seconds, status_code and is_negative_interval (aggregated, counted distinct, pivoted, or dropped at this grain); zone_name, borough_name, is_airport_zone belong to the zone dataset; interval_count, distinct_drivers, distinct_vehicles, total_hours, on_trip_hours, available_hours, break_hours and zone_occupancy_rate are measures this document does not declare (S2).", "content_levels": [{"via": "status_interval_to_date", "level": "day", "key_columns": ["interval_date"]}, {"via": "status_interval_to_daypart", "level": "hour", "key_columns": ["interval_hour"]}, {"via": "status_interval_to_zone", "level": "zone", "key_columns": ["location_id"]}]}]}'
  - name: maintenance
    source: core.fct_maintenance
    primary_key: [maintenance_id]
    description: One row per vehicle maintenance event. Semi-additive — down-days sum across vehicles but not across overlapping date ranges.
    ai_context:
      instructions: Never sum down_days across overlapping periods; expand the event to a daily grain before computing availability.
      synonyms:
        - vehicle downtime
        - maintenance events
    fields:
      - name: maintenance_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: maintenance_id
        datatype: String
        description: Maintenance event identifier; the grain of the downtime fact.
      - name: vehicle_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: vehicle_key
        datatype: String
        description: Vehicle that was in the shop.
      - name: garage_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: garage_key
        datatype: String
        description: Garage the vehicle belongs to, carried from dim_vehicle.
      - name: started_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: started_date
        datatype: Date
        dimension:
          is_time: true
        description: First day of the downtime.
      - name: started_date_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: started_date_key
        datatype: Integer
        description: Surrogate key into date for the start date.
      - name: ended_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: ended_date
        datatype: Date
        dimension:
          is_time: false
        description: Last day of the downtime; a range end, not a time dimension.
      - name: down_days
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: down_days
        datatype: Integer
        description: Days out of service for the event; semi-additive across overlapping ranges.
      - name: maintenance_type
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: maintenance_type
        datatype: String
        description: Kind of work performed.
      - name: cost_usd
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: cost_usd
        datatype: Decimal
        description: Cost of the event in USD, row level.
    custom_extensions:
      - vendor_name: VIBEDATA
        data: '{"vibedata_version": "1.5", "logical_sources": [{"name": "LTS1_detail", "physical_table": "fct_maintenance", "priority_group": 1, "content_grain": ["maintenance_event"], "column_map": {"maintenance_id": "maintenance_id", "vehicle_key": "vehicle_key", "garage_key": "garage_key", "started_date": "started_date", "started_date_key": "started_date_key", "ended_date": "ended_date", "down_days": "down_days", "maintenance_type": "maintenance_type", "cost_usd": "cost_usd"}}]}'
  - name: driver
    source: core.dim_driver
    primary_key: [driver_key]
    description: Type 1 driver dimension — current driver state with their lease and home garage.
    ai_context:
      synonyms:
        - drivers
        - hack drivers
    fields:
      - name: driver_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: driver_key
        datatype: String
        description: Operator's driver identifier.
      - name: driver_ref
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: driver_ref
        datatype: String
        description: Short driver reference used in reports.
      - name: engagement_type
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: engagement_type
        datatype: String
        description: How the driver is engaged (employee, contractor, ...).
      - name: driver_status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: driver_status
        datatype: String
        description: Current activation status of the driver.
      - name: is_wav_certified
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_wav_certified
        datatype: Boolean
        description: Certified to drive a wheelchair-accessible vehicle.
      - name: hire_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: hire_date
        datatype: Date
        dimension:
          is_time: false
        description: Date engagement started; an attribute of the driver, not a time dimension.
      - name: termination_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: termination_date
        datatype: Date
        dimension:
          is_time: false
        description: Date engagement ended; null while active.
      - name: tenure_days
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: tenure_days
        datatype: Integer
        description: Days from hire to the report end; restates with the reporting window.
      - name: garage_key
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: garage_key
        datatype: String
        description: Driver's home garage.
      - name: home_garage_name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: home_garage_name
        datatype: String
        description: Display name of the driver's home garage.
      - name: lease_type
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: lease_type
        datatype: String
