version: 2

unit_tests:
  # --- agg_trip_zone_daily: revenue rank at the cent --------------------------
  - name: trip_zone_daily_ranks_revenue_at_the_cent
    description: >
      Zones are ranked on the day's revenue rounded to the cent, so two zones whose summed
      doubles differ below a cent share a rank, and the next zone's rank is skipped.
    model: agg_trip_zone_daily
    overrides:
      vars: {report_start: '2024-01-01', report_end: '2024-04-01'}
    given:
      - input: ref('fct_trip')
        rows:
          - {pickup_date_key: 20240110, pickup_date: '2024-01-10', pickup_zone_key: z1, pickup_datetime: '2024-01-10 08:00:00', total_amount: 60.003}
          - {pickup_date_key: 20240110, pickup_date: '2024-01-10', pickup_zone_key: z1, pickup_datetime: '2024-01-10 09:00:00', total_amount: 40.001}
          - {pickup_date_key: 20240110, pickup_date: '2024-01-10', pickup_zone_key: z2, pickup_datetime: '2024-01-10 10:00:00', total_amount: 100.001}
          - {pickup_date_key: 20240110, pickup_date: '2024-01-10', pickup_zone_key: z3, pickup_datetime: '2024-01-10 11:00:00', total_amount: 60.0}
      - input: ref('dim_zone')
        rows:
          - {zone_key: z1, zone_natural_key: 1, zone_name: A, borough_name: Queens}
          - {zone_key: z2, zone_natural_key: 2, zone_name: B, borough_name: Queens}
          - {zone_key: z3, zone_natural_key: 3, zone_name: C, borough_name: Queens}
    expect:
      rows:
        - {pickup_location_id: 1, revenue_rank_that_day: 1}
        - {pickup_location_id: 2, revenue_rank_that_day: 1}
        - {pickup_location_id: 3, revenue_rank_that_day: 3}

  # --- agg_hvfhv_trip_zone_daily: report window, grain, unknown zones ---------
  - name: hvfhv_trip_zone_daily_keeps_only_the_report_window
    description: The window is half-open, as in_report_window gives it, so a trip at report_start counts and one at report_end does not.
    model: agg_hvfhv_trip_zone_daily
    overrides:
      vars: {report_start: '2024-01-01', report_end: '2024-04-01'}
    given:
      - input: ref('stg_tlc__fhvhv_tripdata')
        rows:
          - {pickup_location_id: 1, pickup_datetime: '2023-12-31 23:59:59'}
          - {pickup_location_id: 1, pickup_datetime: '2024-01-01 00:00:00'}
          - {pickup_location_id: 1, pickup_datetime: '2024-03-31 23:59:59'}
          - {pickup_location_id: 1, pickup_datetime: '2024-04-01 00:00:00'}
    expect:
      rows:
        - {pickup_location_id: 1, pickup_date: '2024-01-01', hvfhv_trip_count: 1}
        - {pickup_location_id: 1, pickup_date: '2024-03-31', hvfhv_trip_count: 1}

  - name: hvfhv_trip_zone_daily_counts_every_trip_per_zone_and_day
    description: Trips are counted per pickup zone and pickup date, a trip at midnight starts the next day, and an unknown zone is kept as its own row.
    model: agg_hvfhv_trip_zone_daily
    overrides:
      vars: {report_start: '2024-01-01', report_end: '2024-04-01'}
    given:
      - input: ref('stg_tlc__fhvhv_tripdata')
        rows:
          - {pickup_location_id: 7, pickup_datetime: '2024-01-10 08:00:00'}
          - {pickup_location_id: 7, pickup_datetime: '2024-01-10 23:59:59'}
          - {pickup_location_id: 7, pickup_datetime: '2024-01-11 00:00:00'}
          - {pickup_location_id: 264, pickup_datetime: '2024-01-10 12:00:00'}
    expect:
      rows:
        - {pickup_location_id: 7, pickup_date: '2024-01-10', hvfhv_trip_count: 2}
        - {pickup_location_id: 7, pickup_date: '2024-01-11', hvfhv_trip_count: 1}
        - {pickup_location_id: 264, pickup_date: '2024-01-10', hvfhv_trip_count: 1}
