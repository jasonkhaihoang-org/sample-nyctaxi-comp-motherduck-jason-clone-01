version: 2

models:
  - name: mart_daily_zone_revenue
    description: >
      Daily revenue by pickup zone. The billable rule (ADR 0003) is applied
      here and nowhere upstream.
    access: protected
    columns:
      - name: trip_date
        tests: [not_null]
      - name: total_revenue
        tests: [not_null]
      - name: pickup_location_id
        tests:
          - relationships: {arguments: {to: ref('dim_zone'), field: zone_natural_key}}
          - not_null
      - name: congestion_surcharge_revenue
        description: >
          Congestion surcharges recorded on the zone-day's billable trips; a trip
          with none recorded adds nothing. Already included in surcharge_revenue.
        tests: [not_null]
      - name: congestion_surcharge_trip_count
        description: Billable trips that carry a congestion surcharge (above zero).
        tests: [not_null]
      - name: airport_fee_revenue
        description: >
          Airport fees recorded on the zone-day's billable trips; a trip with none
          recorded (a missing yellow fee, or any green trip) adds nothing. Not part
          of surcharge_revenue.
        tests: [not_null]
      - name: airport_fee_trip_count
        description: Billable trips that carry an airport fee (above zero).
        tests: [not_null]

  - name: mart_monthly_service_summary
    description: Monthly volume and revenue by fleet and payment method.
    access: protected
    columns:
      - name: trip_month
        tests: [not_null]
      - name: service_type
        tests:
          - accepted_values: {arguments: {values: ['yellow', 'green']}}
          - not_null
      - name: payment_method_name
        tests: [not_null]
      - name: avg_measurable_tip_rate
        description: >
          Mean measurable tip rate over the row's trips where it is measurable
          (ADR 0016's exception; ADR 0011). Null when the payment method records
          no tips.
      - name: measurable_tip_trip_count
        description: Trips whose tip rate is measurable.
        tests: [not_null]
      - name: tip_measurable_share
        description: measurable_tip_trip_count over all the row's trips.
        tests: [not_null]

  - name: mart_revenue_component_bridge
    description: >
      The fare-to-total walk, unpivoted one component per row. The residual is
      its own component rather than being absorbed into a real one: if it is
      non-zero the walk does not balance, and that is a finding about the source.
    columns:
      - name: component_name
        tests: [not_null]
      - name: trip_month
        tests: [not_null]
      - name: service_type_key
        tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_service_type'), field: service_type_key}}
      - name: borough_name
        tests: [not_null]
