  fhvhv_tripdata:
    description: One row per high-volume for-hire (HVFHV) trip record, as published by the TLC for January 2024.
    columns:
    - name: hvfhs_license_num
      description: "TLC licence number of the high-volume for-hire service (HVFHS) company that dispatched the trip."
      source_ref: tlc.fhvhv_tripdata.hvfhs_license_num
    - name: dispatching_base_num
      description: "TLC base licence number of the base that dispatched the trip."
      source_ref: tlc.fhvhv_tripdata.dispatching_base_num
    - name: originating_base_num
      description: "Base number of the base that received the original trip request."
      source_ref: tlc.fhvhv_tripdata.originating_base_num
    - name: request_datetime
      description: "Date and time when the passenger requested to be picked up."
      source_ref: tlc.fhvhv_tripdata.request_datetime
    - name: on_scene_datetime
      description: "Date and time when the driver arrived at the pick-up location; recorded for accessible-vehicle trips only."
      source_ref: tlc.fhvhv_tripdata.on_scene_datetime
    - name: pickup_datetime
      description: "Date and time of the trip pick-up."
      source_ref: tlc.fhvhv_tripdata.pickup_datetime
    - name: dropoff_datetime
      description: "Date and time of the trip drop-off."
      source_ref: tlc.fhvhv_tripdata.dropoff_datetime
    - name: PULocationID
      description: "TLC taxi zone in which the trip began."
      source_ref: tlc.fhvhv_tripdata.PULocationID
    - name: DOLocationID
      description: "TLC taxi zone in which the trip ended."
      source_ref: tlc.fhvhv_tripdata.DOLocationID
    - name: trip_miles
      description: "Total miles for the passenger trip."
      source_ref: tlc.fhvhv_tripdata.trip_miles
    - name: trip_time
      description: "Total time in seconds for the passenger trip."
      source_ref: tlc.fhvhv_tripdata.trip_time
    - name: base_passenger_fare
      description: "Base passenger fare before tolls, tips, taxes and fees. Not comparable with a taxi meter fare."
      source_ref: tlc.fhvhv_tripdata.base_passenger_fare
    - name: tolls
      description: "Total amount of all tolls paid on the trip."
      source_ref: tlc.fhvhv_tripdata.tolls
    - name: bcf
      description: "Total amount collected on the trip for the Black Car Fund."
      source_ref: tlc.fhvhv_tripdata.bcf
    - name: sales_tax
      description: "Total amount collected on the trip for New York State sales tax."
      source_ref: tlc.fhvhv_tripdata.sales_tax
    - name: congestion_surcharge
      description: "Total amount collected on the trip for the New York State congestion surcharge."
      source_ref: tlc.fhvhv_tripdata.congestion_surcharge
    - name: airport_fee
      description: "Fee for drop-offs and pick-ups at LaGuardia, Newark and John F. Kennedy airports."
      source_ref: tlc.fhvhv_tripdata.airport_fee
    - name: tips
      description: "Total amount of tips received from the passenger."
      source_ref: tlc.fhvhv_tripdata.tips
    - name: driver_pay
      description: "Total driver pay, not including tolls or tips and net of commission, surcharges or taxes."
      source_ref: tlc.fhvhv_tripdata.driver_pay
    - name: shared_request_flag
      description: "Whether the passenger agreed to a shared or pooled ride, regardless of whether they were matched: Y or N."
      source_ref: tlc.fhvhv_tripdata.shared_request_flag
    - name: shared_match_flag
      description: "Whether the passenger shared the vehicle with another passenger who booked separately at any point during the trip: Y or N."
      source_ref: tlc.fhvhv_tripdata.shared_match_flag
    - name: access_a_ride_flag
      description: "Whether the trip was administered on behalf of the Metropolitan Transportation Authority (MTA): Y or N."
      source_ref: tlc.fhvhv_tripdata.access_a_ride_flag
    - name: wav_request_flag
      description: "Whether the passenger requested a wheelchair-accessible vehicle (WAV): Y or N."
      source_ref: tlc.fhvhv_tripdata.wav_request_flag
    - name: wav_match_flag
      description: "Whether the trip occurred in a wheelchair-accessible vehicle (WAV): Y or N."
      source_ref: tlc.fhvhv_tripdata.wav_match_flag
    - name: _dlt_load_id
      description: Identifier of the dlt load package that wrote this row. Joins to `_dlt_loads.load_id`.
    - name: _dlt_id
      description: Synthetic row identifier assigned by dlt at load time. Unique within the bronze table;
        not a natural primary key.
  taxi_zone_lookup:
    description: 'The TLC taxi zone lookup: one row per zone.'
    columns:
    - name: LocationID
      description: TLC taxi zone identifier.
      source_ref: tlc.taxi_zone_lookup.LocationID
    - name: Borough
      description: Borough the zone belongs to.
      source_ref: tlc.taxi_zone_lookup.Borough
    - name: Zone
      description: Name of the zone.
      source_ref: tlc.taxi_zone_lookup.Zone
    - name: service_zone
      description: TLC service zone grouping for the zone.
      source_ref: tlc.taxi_zone_lookup.service_zone
    - name: _dlt_load_id
      description: Identifier of the dlt load package that wrote this row. Joins to `_dlt_loads.load_id`.
    - name: _dlt_id
      description: Synthetic row identifier assigned by dlt at load time. Unique within the bronze table;
        not a natural primary key.
