# transformation/profiles.yml — the profile every dbt job notebook in the Domain reads.
# `prod` holds the Domain's literal coordinates: a Fabric notebook has none of the agent's
# environment, so an env_var() here cannot resolve. An Intent runs with its own profile,
# which Studio writes outside the repository; git never carries it.
<profile_name>:
  target: prod
  outputs:
    prod:
      type: fabricspark
      method: livy
      authentication: fabric_notebook
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: "<VD_DOMAIN_FABRIC_LAKEHOUSE_WORKSPACE_ID>"
      lakehouse: "<VD_DOMAIN_FABRIC_LAKEHOUSE_NAME>"
      lakehouseid: "<VD_DOMAIN_FABRIC_LAKEHOUSE_ID>"
      schema: "<VD_DOMAIN_SCHEMA>"
      spark_config:
        name: "<VD_DOMAIN_SLUG>_dbt"
      connect_retries: 3
      retry_all: true
      session_start_timeout: 900
      threads: 4
