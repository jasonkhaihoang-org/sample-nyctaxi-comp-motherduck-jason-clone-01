# transformation/profiles.yml — the profile every dbt job notebook in the Domain reads.
# `prod` holds the Domain's literal coordinates: a Fabric notebook has none of the agent's
# environment, so an env_var() here cannot resolve. An Intent runs with its own profile,
# which Studio writes outside the repository; git never carries it.
#
# Do not add a `driver:` key — dbt-fabric 1.11 selects the driver through mssql-python
# and rejects the field.
<profile_name>:
  target: prod
  outputs:
    prod:
      type: fabric
      authentication: notebookutils
      host: "<VD_DOMAIN_FABRIC_WAREHOUSE_SQL_ENDPOINT>"
      database: "<VD_DOMAIN_FABRIC_WAREHOUSE_NAME>"
      workspace_id: "<VD_DOMAIN_FABRIC_WAREHOUSE_WORKSPACE_ID>"
      schema: "<VD_DOMAIN_SCHEMA>"
      retries: 3
      threads: 4
