bundle:
  name: <domain_slug>

include:
  - orchestration/*.job.yml

variables:
  warehouse_id:
    description: The Domain's SQL warehouse.
  catalog:
    description: The Domain's catalog.
  schema:
    description: The Domain's Primary Schema, dbt's target schema.
  dlt_env:
    description: JSON of dlt environment overrides for the pipeline notebooks. By default the catalog and SQL warehouse the job is deployed with; a sandbox run passes the Ephemeral catalog, warehouse, the Intent's schema prefix and Studio's staging layout.
    default: '{"DESTINATION__DATABRICKS__CREDENTIALS__CATALOG": "${var.catalog}", "DESTINATION__DATABRICKS__CREDENTIALS__HTTP_PATH": "/sql/1.0/warehouses/${var.warehouse_id}"}'
  schema_prefix:
    description: The schema prefix the dbt task builds and reads under; empty in production, the Intent's prefix in a sandbox run.
    default: ""
  schedule_pause_status:
    description: PAUSED or UNPAUSED; production CI/CD activates schedules.
    default: PAUSED

targets:
  sandbox:
    mode: development
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
