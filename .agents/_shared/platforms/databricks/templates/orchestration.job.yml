resources:
  jobs:
    <job_name>:
      name: <domain_slug>_<job_name>
      max_concurrent_runs: <max_concurrent_runs>
      schedule:
        quartz_cron_expression: "<quartz_cron>"
        timezone_id: <timezone>
        pause_status: ${var.schedule_pause_status}
      tasks:
        - task_key: dlt_<pipeline_name>
          environment_key: dlt
          notebook_task:
            notebook_path: ../ingestion/<pipeline_name>_pipeline.ipynb
            base_parameters:
              pipeline_name: <pipeline_name>
              connection_name: <connection>
              ingestion_dir: ${workspace.file_path}/ingestion
              dlt_ingest_limit: "-1"
              dev_mode: "false"
              dlt_env: ${var.dlt_env}

        - task_key: dbt
          depends_on:
            - task_key: dlt_<pipeline_name>
          environment_key: dbt
          environment_variables_key: dbt
          dbt_task:
            project_directory: ../transformation
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}
            commands:
              - dbt deps
              - dbt build --select <selector>

      environment_variables:
        - environment_variables_key: dbt
          spec:
            variables:
              VD_EPHM_SCHEMA_PREFIX: ${var.schema_prefix}

      environments:
        - environment_key: dlt
          spec:
            environment_version: "5"
        - environment_key: dbt
          spec:
            environment_version: "5"
            dependencies:
              - -c ${workspace.file_path}/.github/managed-constraints.txt
              - dbt-core
              - dbt-databricks
