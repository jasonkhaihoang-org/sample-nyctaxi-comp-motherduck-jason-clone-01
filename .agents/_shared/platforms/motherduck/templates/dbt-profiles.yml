# transformation/profiles.yml — the profile every dbt Flight in the Domain reads.
#
# The defaults are the Domain's, for a `dbt` invoked outside a Flight. Every
# Flight run supplies both, so git carries no ephemeral target.
#
# `type: duckdb`, never `motherduck`: that needs a separate adapter which fails
# dependency resolution.
<profile_name>:
  target: flight
  outputs:
    flight:
      type: duckdb
      path: "md:{{ env_var('DESTINATION_DATABASE', '<domain_database>') }}"
      schema: "{{ env_var('DBT_SCHEMA', '<domain_schema>') }}"
      threads: 4
